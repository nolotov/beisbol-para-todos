# Resultados de postemporada MLB: cada mañana genera las 3 láminas de cada juego de ayer,
# el resumen.json y (si existe el secreto ANTHROPIC_API_KEY) los textos para redes.
# Todo queda como artefacto descargable del run y los textos se ven en el resumen.
#
# El cron solo corre cuando este archivo está en la rama por defecto (main).
# Mientras tanto se puede lanzar a mano desde la pestaña Actions ("Run workflow").
name: Resultados MLB

on:
  schedule:
    # 09:17 UTC = 06:17 en Santiago (UTC-3): todo listo antes de las 7 para publicar cuando
    # Venezuela se despierta. El juego más tardío (costa oeste) termina ~01:30 de Santiago.
    # Solo octubre y noviembre: fuera de la postemporada no hace nada útil.
    - cron: "17 9 * 10,11 *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha oficial MLB (YYYY-MM-DD). Vacío = ayer en hora del Este"
        required: false
      fase:
        description: "todas, L=Campeonato, D=Divisional, F=Comodín, W=Mundial"
        required: false
        default: "todas"

permissions:
  contents: read

concurrency:
  group: resultados-mlb
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # bash -eo pipefail: un error antes del "| tee" sí hace fallar el paso

jobs:
  # El cron de GitHub se atrasa horas (llegó a correr a las 14:00). El disparo puntual viene de
  # cron-job.org (workflow_dispatch). El cron de aquí queda solo de respaldo: si ese día ya hubo
  # un run manual o de cron-job.org, no repite el paquete en Telegram.
  control:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      correr: ${{ steps.revisar.outputs.correr }}
    steps:
      - name: ¿Ya se envió hoy?
        id: revisar
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "correr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          HOY=$(date -u +%F)   # en UTC: el disparo (~09:10) y el cron atrasado caen el mismo día
          PREVIOS=$(gh run list -R "${{ github.repository }}" --workflow "${{ github.workflow }}" \
            --event workflow_dispatch --limit 20 --json createdAt,conclusion \
            --jq "[.[] | select(.createdAt[0:10] == \"$HOY\")
                       | select(.conclusion != \"failure\" and .conclusion != \"cancelled\")] | length")
          if [ "${PREVIOS:-0}" -gt 0 ]; then
            echo "Ya hubo $PREVIOS run(s) manual(es) hoy ($HOY): el cron de respaldo no repite el envío."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Hoy ($HOY) no corrió el disparo externo: el cron de respaldo hace el envío."
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

  resultados:
    needs: control
    if: ${{ needs.control.outputs.correr == 'true' }}
    # Fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-oct-2026 (en plena postemporada)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Generar tarjetas y resumen
        id: gen
        env:
          FECHA: ${{ inputs.fecha }}
          FASE: ${{ inputs.fase || 'todas' }}
        run: |
          ARGS="--fase $FASE"
          if [ -n "$FECHA" ]; then ARGS="$ARGS --fecha $FECHA"; fi
          python -m bpt mlb-resultados $ARGS | tee salida.txt
          echo "carpeta=$(ls -d output/resultados/mlb/*/ | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Redactar textos (si hay ANTHROPIC_API_KEY)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python -m bpt redactar --carpeta "${{ steps.gen.outputs.carpeta }}" | tee -a salida.txt

      # Reels (variable de repo REELS = 1): video vertical con las láminas y la voz del guion.
      # Si falla, el paquete sigue igual, sin Reel.
      - name: Armar Reels
        if: ${{ vars.REELS == '1' && steps.gen.outputs.carpeta != '' }}
        continue-on-error: true
        run: |
          pip install -q -e ".[video]"
          python -m bpt reel --carpeta "${{ steps.gen.outputs.carpeta }}" | tee -a salida.txt

      # El paquete se sube ANTES de Telegram: el botón de publicar lo descarga desde aquí.
      - uses: actions/upload-artifact@v7
        if: always() && steps.gen.outputs.carpeta != ''
        with:
          name: resultados-mlb-${{ github.run_number }}
          path: ${{ steps.gen.outputs.carpeta }}
          retention-days: 30

      - name: Enviar a Telegram (si hay TELEGRAM_BOT_TOKEN)
        # Aunque falle el redactor: en ese caso llegan solo las láminas
        if: ${{ always() && steps.gen.outcome == 'success' && env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          # Variables del repo (Settings > Variables): 1 = cada pieza trae el botón de esa red
          BPT_PUBLICAR_INSTAGRAM: ${{ vars.PUBLICAR_INSTAGRAM }}
          BPT_PUBLICAR_THREADS: ${{ vars.PUBLICAR_THREADS }}
          BPT_PUBLICAR_X: ${{ vars.PUBLICAR_X }}
        run: python -m bpt notificar --carpeta "${{ steps.gen.outputs.carpeta }}" | tee -a salida.txt

      - name: Avisar por Telegram si algo falló
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ MBP: falló el workflow de resultados. Revisa: ${URL}"

      - name: Resumen del run
        if: always()
        run: |
          echo '### Resultados MLB' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat salida.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          TEXTOS="${{ steps.gen.outputs.carpeta }}textos.md"
          if [ -f "$TEXTOS" ]; then cat "$TEXTOS" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '> Sin secreto ANTHROPIC_API_KEY: se generaron las tarjetas, pero no los textos.' >> "$GITHUB_STEP_SUMMARY"
          fi
