# Publica una pieza ya aprobada desde Telegram (fase 4) en Instagram, Threads y/o X: un
# carrusel de resultados o la historia del día (solo Instagram), según el paquete del run.
#
# Lo dispara el relé (infra/telegram-relay) cuando se toca "✅ Sí, publicar". También se puede
# lanzar a mano desde Actions con el número del run de resultados y la pieza.
#
#   1. Descarga el paquete (artefacto) del run de resultados indicado.
#   2. Convierte las láminas de la pieza a JPEG (Instagram no acepta PNG).
#   3. Si va a Instagram o Threads, las sube a la rama `publicaciones` (repo público = URL
#      pública que Meta descarga). La rama se pisa en cada publicación: no crece.
#      A X se le suben los archivos directamente.
#   4. Publica en cada red y lo cuenta en Telegram (enlaces, errores y "🔁 Reintentar").
name: Publicar en redes

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Número del run de 'Resultados MLB/LVBP', 'Historia del día', 'Especial MBP' o 'Editor MBP' que trae el paquete"
        required: true
      pieza:
        description: "1, 2... (juego MLB, en el orden de Telegram), jornada (LVBP) o 1 (historia)"
        required: true
      message_id:
        description: "Mensaje de Telegram a actualizar (lo llena el relé; vacío = no avisar)"
        required: false
      destino:
        description: "Redes: i=Instagram, t=Threads, x=X (ej. itx). Vacío = Instagram"
        required: false
      quedan:
        description: "(relé) Redes que tenía el menú del mensaje. Vacío = las de destino"
        required: false

permissions:
  contents: write   # subir los JPEG a la rama publicaciones
  actions: read     # descargar el artefacto del run de resultados

concurrency:
  group: publicar     # una publicación a la vez: la rama publicaciones se pisa en cada una
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  instagram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      PIEZA: ${{ inputs.pieza }}
      MESSAGE_ID: ${{ inputs.message_id }}
      DESTINO: ${{ inputs.destino || 'i' }}
      QUEDAN: ${{ inputs.quedan || inputs.destino || 'i' }}
      URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validar entrada
        run: |
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::run_id inválido"; exit 1; }
          [[ "$PIEZA" =~ ^([0-9]{1,2}|jornada)$ ]] || { echo "::error::pieza inválida"; exit 1; }
          [[ -z "$MESSAGE_ID" || "$MESSAGE_ID" =~ ^[0-9]{1,15}$ ]] || { echo "::error::message_id inválido"; exit 1; }
          [[ "$DESTINO" =~ ^[itx]{1,3}$ ]] || { echo "::error::destino inválido"; exit 1; }
          [[ "$QUEDAN" =~ ^[itx]{1,3}$ ]] || { echo "::error::quedan inválido"; exit 1; }

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        id: instalar
        run: pip install -e .

      - name: ¿Hay credenciales de las redes pedidas?
        run: |
          falta=()
          [[ "$DESTINO" == *i* && -z "$IG_ACCESS_TOKEN" ]] && falta+=(IG_ACCESS_TOKEN)
          [[ "$DESTINO" == *t* && -z "$THREADS_ACCESS_TOKEN" ]] && falta+=(THREADS_ACCESS_TOKEN)
          [[ "$DESTINO" == *x* && ( -z "$X_API_KEY" || -z "$X_ACCESS_TOKEN" ) ]] && falta+=(X_API_KEY/X_ACCESS_TOKEN)
          if [ ${#falta[@]} -gt 0 ]; then
            echo "faltan secretos en GitHub: ${falta[*]}" > motivo.txt
            echo "::error::Faltan secretos: ${falta[*]}"; exit 1
          fi

      - name: Descargar el paquete del run ${{ inputs.run_id }}
        id: paquete
        run: |
          NOMBRE=$(gh run view "$RUN_ID" -R "$REPO" --json workflowName --jq .workflowName 2>/dev/null || true)
          if [[ "$NOMBRE" != Resultados* && "$NOMBRE" != "Historia del día" && "$NOMBRE" != "Especial MBP" && "$NOMBRE" != "Editor MBP" ]]; then
            echo "el run $RUN_ID no es de resultados, historia, especial ni editor" > motivo.txt
            echo "::error::El run $RUN_ID no es de 'Resultados MLB/LVBP', 'Historia del día', 'Especial MBP' ni 'Editor MBP' ($NOMBRE)"; exit 1
          fi
          if ! gh run download "$RUN_ID" -R "$REPO" -D paquete; then
            echo "no encontré el paquete del run $RUN_ID (¿venció o aún se está subiendo?)" > motivo.txt
            exit 1
          fi
          RESUMEN=$(find paquete -name resumen.json | head -1)
          echo "carpeta=$(dirname "$RESUMEN")" >> "$GITHUB_OUTPUT"

      - name: Preparar la pieza ${{ inputs.pieza }}
        id: preparar
        env:
          CARPETA: ${{ steps.paquete.outputs.carpeta }}
        run: |
          if ! python -m bpt publicar-preparar --carpeta "$CARPETA" \
               --pieza "$PIEZA" --destino publico --prefijo "${RUN_ID}-${PIEZA}" --plan plan.json \
               2> error.txt; then
            sed 's/^\[error\] //' error.txt > motivo.txt; cat error.txt; exit 1
          fi
          echo "titular=$(jq -r .titular plan.json)" >> "$GITHUB_OUTPUT"

      - name: Subir los JPEG a la rama publicaciones
        id: subir
        if: ${{ contains(env.DESTINO, 'i') || contains(env.DESTINO, 't') }}
        run: |
          cd publico
          git init -q -b publicaciones
          git -c user.name="mbp-bot" -c user.email="mbp-bot@users.noreply.github.com" add -A
          git -c user.name="mbp-bot" -c user.email="mbp-bot@users.noreply.github.com" \
            commit -qm "Pieza $PIEZA del run $RUN_ID"
          SHA=$(git rev-parse HEAD)
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" publicaciones
          BASE="https://raw.githubusercontent.com/${REPO}/${SHA}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # Instagram descarga las imágenes enseguida: esperar a que la URL responda
          PRIMERA=$(jq -r '.archivos[0]' ../plan.json)
          for i in $(seq 1 12); do
            if curl -sfI "$BASE/$PRIMERA" > /dev/null; then echo "URL pública lista"; exit 0; fi
            sleep 5
          done
          echo "las imágenes no quedaron accesibles en raw.githubusercontent.com" > ../motivo.txt
          exit 1

      - name: Publicar en las redes
        env:
          BASE: ${{ steps.subir.outputs.base }}
        run: |
          ARGS=(--plan plan.json --destino "$DESTINO" --quedan "$QUEDAN" --carpeta publico
                --run-id "$RUN_ID")
          if [ -n "$BASE" ]; then ARGS+=(--base-url "$BASE"); fi
          if [ -n "$MESSAGE_ID" ]; then ARGS+=(--message-id "$MESSAGE_ID"); fi
          python -m bpt publicar-redes "${ARGS[@]}"

      # Solo si el fallo fue ANTES de publicar: si publicar-redes ya avisó, no se repite.
      - name: Avisar en Telegram si falló
        if: ${{ failure() && steps.instalar.outcome == 'success' && env.MESSAGE_ID != '' && hashFiles('avisado.txt') == '' }}
        env:
          TITULAR: ${{ steps.preparar.outputs.titular }}
        run: |
          ARGS=(--message-id "$MESSAGE_ID" --run-id "$RUN_ID" --pieza "$PIEZA" --url-run "$URL_RUN"
                --destino "$DESTINO" --quedan "$QUEDAN")
          if [ -n "$TITULAR" ]; then ARGS+=(--titular "$TITULAR"); fi
          python -m bpt publicar-fallo "${ARGS[@]}"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Publicar · run $RUN_ID · pieza $PIEZA · redes $DESTINO"
            if [ -f plan.json ]; then echo "**$(jq -r .titular plan.json)**"; fi
            if [ -f motivo.txt ]; then echo "> ❌ $(cat motivo.txt)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
