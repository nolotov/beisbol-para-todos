[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beisbol-para-todos"
version = "0.9.0"
description = "Toolkit de datos y visualización para análisis sabermétrico MLB/LVBP"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "matplotlib>=3.8",
  "pybaseball>=2.2.7",
  "requests>=2.31",
  "requests-oauthlib>=1.3",
  "beautifulsoup4>=4.12",
  "tzdata; sys_platform == 'win32'",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bpt = "bpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
